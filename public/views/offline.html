<!doctype html>
<html lang="en">
    <head>
        <title>Offline</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0d0e12" />
        <meta name="color-scheme" content="dark" />
        <meta name="robots" content="noindex" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0d0e12;
                color: #e6e9ee;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                text-align: center;
            }
            main {
                padding: 24px;
                max-width: 420px;
            }
            img {
                width: 96px;
                height: 96px;
                border-radius: 22%;
            }
            h1 {
                font-size: 1.5rem;
                margin: 20px 0 8px;
            }
            p {
                color: #9aa4b2;
                line-height: 1.5;
                margin: 0 0 24px;
            }
            button {
                cursor: pointer;
                border: 0;
                border-radius: 8px;
                padding: 12px 28px;
                font-size: 1rem;
                font-weight: 600;
                color: #fff;
                background: #376df9;
            }
            button:hover {
                background: #4678f9;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/images/pwa/icon-192.png" alt="" />
            <h1>You're offline</h1>
            <p>Check your internet connection. The meeting will be available again as soon as you're back online.</p>
            <button id="retry" type="button">Try again</button>
        </main>
        <script>
            document.getElementById('retry').addEventListener('click', () => location.reload());
            window.addEventListener('online', () => location.reload());
        </script>
    </body>
</html>
